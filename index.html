<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeezy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="bar">
            <div class="left">
                <div class="icon-box">
                    <img src="plus.png" alt="plus icon">
                </div>
            </div>

            <div class="center">
                <div class="top-row">
                    <span class="black">NEW</span>
                    <span>MENS</span>
                    <span>WOMENS</span>
                </div>
                <div class="bottom-row">
                    <span>FOOTWEAR</span>
                    <span>ACCESSORIES</span>
                </div>
                <div class="third-row">
                    <span>SLIDES</span>
                </div>
            </div>

            <div class="right">
                <div class="icon-box">
                    <img src="bag.png" alt="bag icon">
                </div>
            </div>
        </nav>
    </header>

    <main>
        <img class = "big" src="yeez.png">
    </main>

    <footer>
        <nav class="bottom">
            <span class = "space">CONTACT</span>
            <span class = "space">TERMS</span>
            <span class = "space">PRIVACY</span>
            <span class = "space">ACCESSIBILITY</span>
            <span class = "space">DNSMPI</span>
            <span class = "space">COOKIES</span>
            <span class = "space">ORDER STATUS</span>
        </nav>
    </footer>
</body>
</html>
